name: ThreadRadar Daily Run

on:
  schedule:
    - cron: "30 8 * * 1-5"
  workflow_dispatch:

jobs:
  threadradar:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Python setup ───────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      # ── 3. Set today's date ───────────────────────────────────────
      - name: Set today's date
        run: echo "TODAY=$(date +%Y-%m-%d)" >> $GITHUB_ENV

      # ── 4. Restore DB from cache ──────────────────────────────────
      - name: Restore database from cache
        uses: actions/cache@v4
        id: db-cache
        with:
          path: backend/threadradar.db
          key: threadradar-db-latest
          restore-keys: threadradar-db-

      # ── 5. Verify or seed database ────────────────────────────────
      - name: Verify or seed database
        run: |
          if [ -f backend/threadradar.db ]; then
            echo "✓ Database restored from cache"
            ls -lh backend/threadradar.db
          else
            echo "⚠ No cached DB — checking for backup seed..."
            LATEST=$(ls backend/db-backup/threadradar_*.db 2>/dev/null | sort | tail -1)
            if [ -n "$LATEST" ]; then
              cp "$LATEST" backend/threadradar.db
              echo "✓ Seeded from: $LATEST"
              ls -lh backend/threadradar.db
            else
              echo "⚠ No backup found — will initialize fresh DB"
            fi
          fi

          # Show DB contents before run
          if [ -f backend/threadradar.db ]; then
            echo "--- DB contents before run ---"
            python3 << 'EOF'
              import sqlite3
              conn = sqlite3.connect('backend/threadradar.db')
              tables = ['daily_sentiment', 'daily_contexts', 'posts', 'bearish_stocks', 'performance_tracking']
              for t in tables:
                  try:
                      count = conn.execute(f'SELECT COUNT(*) FROM {t}').fetchone()[0]
                      print(f'  {t}: {count} rows')
                  except Exception as e:
                      print(f'  {t}: ERROR - {e}')
              conn.close()
            EOF
          fi

      # ── 6. Create logs directory ──────────────────────────────────
      - name: Create logs directory
        run: mkdir -p logs

      # ── 7. Run main pipeline ──────────────────────────────────────
      - name: Run ThreadRadar main pipeline
        working-directory: backend
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PROXY_USER: ${{ secrets.PROXY_USER }}
          PROXY_PASS: ${{ secrets.PROXY_PASS }}
          PROXY_HOST: ${{ secrets.PROXY_HOST }}
          PROXY_PORT: ${{ secrets.PROXY_PORT }}
        run: |
          echo "Working directory: $(pwd)"
          echo "DB before run: $(ls -lh threadradar.db 2>/dev/null || echo 'NOT FOUND')"
          echo "=== ThreadRadar starting at $(date) ===" | tee ../logs/run_$(date +%Y-%m-%d).log
          python -u main.py 2>&1 | tee -a ../logs/run_$(date +%Y-%m-%d).log
          echo "DB after run: $(ls -lh threadradar.db 2>/dev/null || echo 'NOT FOUND')"
          echo "=== Main pipeline done at $(date) ===" | tee -a ../logs/run_$(date +%Y-%m-%d).log

      # ── 8. Verify DB after pipeline ───────────────────────────────
      - name: Verify database after pipeline
        run: |
          echo "--- DB contents after main pipeline ---"
          echo "DB size: $(ls -lh backend/threadradar.db 2>/dev/null | awk '{print $5}' || echo 'NOT FOUND')"
          python3 << 'EOF'
            import sqlite3
            conn = sqlite3.connect('backend/threadradar.db')
            tables = ['daily_sentiment', 'daily_contexts', 'posts', 'bearish_stocks', 'performance_tracking']
            for t in tables:
                try:
                    count = conn.execute(f'SELECT COUNT(*) FROM {t}').fetchone()[0]
                    print(f'  {t}: {count} rows')
                except Exception as e:
                    print(f'  {t}: ERROR - {e}')

            import os
            today = os.environ.get('TODAY', '')
            if today:
                for t in ['daily_sentiment', 'daily_contexts', 'performance_tracking']:
                    try:
                        col = 'date' if t != 'performance_tracking' else 'flagged_date'
                        count = conn.execute(
                            f'SELECT COUNT(*) FROM {t} WHERE {col} = ?', (today,)
                        ).fetchone()[0]
                        print(f'  {t} today ({today}): {count} rows')
                    except Exception as e:
                        print(f'  {t} today: ERROR - {e}')
            conn.close()
          EOF
        env:
          TODAY: ${{ env.TODAY }}

      # ── 9. Run price updater ──────────────────────────────────────
      - name: Run price updater
        working-directory: backend
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PROXY_USER: ${{ secrets.PROXY_USER }}
          PROXY_PASS: ${{ secrets.PROXY_PASS }}
          PROXY_HOST: ${{ secrets.PROXY_HOST }}
          PROXY_PORT: ${{ secrets.PROXY_PORT }}
        run: |
          echo "=== Price updater starting at $(date) ===" | tee -a ../logs/run_$(date +%Y-%m-%d).log
          python -u price_updater.py 2>&1 | tee -a ../logs/run_$(date +%Y-%m-%d).log
          echo "=== Price updater done at $(date) ===" | tee -a ../logs/run_$(date +%Y-%m-%d).log

      # ── 10. Verify DB after price updater ─────────────────────────
      - name: Verify database after price updater
        run: |
          echo "--- DB contents after price updater ---"
          echo "DB size: $(ls -lh backend/threadradar.db | awk '{print $5}')"
          python3 << 'EOF'
            import sqlite3
            conn = sqlite3.connect('backend/threadradar.db')
            tables = ['daily_sentiment', 'daily_contexts', 'posts', 'bearish_stocks', 'performance_tracking']
            for t in tables:
                try:
                    count = conn.execute(f'SELECT COUNT(*) FROM {t}').fetchone()[0]
                    print(f'  {t}: {count} rows')
                except Exception as e:
                    print(f'  {t}: ERROR - {e}')
            conn.close()
          EOF

      # ── 11. Upload DB to Railway ──────────────────────────────────
      - name: Upload database to Railway
        working-directory: backend
        env:
          RAILWAY_URL: ${{ secrets.RAILWAY_URL }}
          UPLOAD_API_KEY: ${{ secrets.UPLOAD_API_KEY }}
        run: |
          echo "Uploading database to Railway..."
          response=$(curl -s -w "\n%{http_code}" \
            -X POST \
            -H "x-api-key: $UPLOAD_API_KEY" \
            -F "file=@threadradar.db" \
            "$RAILWAY_URL/api/upload-db")

          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | head -1)

          echo "Response: $body"
          if [ "$http_code" != "200" ]; then
            echo "::error::DB upload failed with HTTP $http_code"
            exit 1
          fi
          echo "✓ Database uploaded to Railway successfully"

      # ── 12. Save DB back to cache ─────────────────────────────────
      - name: Save database to cache
        uses: actions/cache@v4
        with:
          path: backend/threadradar.db
          key: threadradar-db-latest

      # ── 13. Daily DB backup to repo ───────────────────────────────
      - name: Daily database backup
        if: always()
        run: |
          mkdir -p backend/db-backup
          if [ -f backend/threadradar.db ]; then
            cp backend/threadradar.db backend/db-backup/threadradar_${{ env.TODAY }}.db
            git config --global user.email "threadradar-bot@github.com"
            git config --global user.name "ThreadRadar Bot"
            git add backend/db-backup/
            git diff --staged --quiet && echo "No DB changes" || \
              git commit -m "Daily DB backup ${{ env.TODAY }} [skip ci]"
            git push || echo "Push failed"
          else
            echo "No DB file to backup"
          fi

      # ── 14. Commit logs and output ────────────────────────────────
      - name: Commit logs and output files
        if: always()
        run: |
          git config --global user.email "threadradar-bot@github.com"
          git config --global user.name "ThreadRadar Bot"
          git add logs/run_${{ env.TODAY }}.log || true
          git add backend/output.json -f || true
          git add backend/output.txt -f || true
          git diff --staged --quiet && echo "No changes to commit" || \
            git commit -m "Run ${{ env.TODAY }} output and logs [skip ci]"
          git push || echo "Push failed — non-critical"

      # ── 15. Upload artifacts ──────────────────────────────────────
      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: threadradar-${{ github.run_number }}
          path: |
            logs/run_${{ env.TODAY }}.log
            backend/output.json
            backend/output.txt
          retention-days: 30

      # ── 16. Email on success ──────────────────────────────────────
      - name: Email on success
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "ThreadRadar ✓ Run completed ${{ github.run_number }}"
          to: ${{ secrets.GMAIL_USERNAME }}
          from: ThreadRadar Bot
          attachments: backend/output.txt
          body: |
            ThreadRadar daily run completed successfully.

            Run: #${{ github.run_number }}
            Date: ${{ env.TODAY }}

            Attached: today's output summary.
            Full artifacts and logs:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # ── 17. Email on failure ──────────────────────────────────────
      - name: Email on failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "ThreadRadar ✗ Run FAILED ${{ github.run_number }}"
          to: ${{ secrets.GMAIL_USERNAME }}
          from: ThreadRadar Bot
          body: |
            ThreadRadar daily run FAILED.

            Run: #${{ github.run_number }}
            Date: ${{ env.TODAY }}

            Check the error in GitHub Actions:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
